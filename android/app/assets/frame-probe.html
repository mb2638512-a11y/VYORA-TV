<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Vyora frame probe</title>
  <style>
    body { margin: 0; background: #0b0f16; color: #e6edf6; font: 14px system-ui, sans-serif; }
    h1 { font-size: 15px; padding: 10px 14px; margin: 0; background: #161b22; }
    iframe { width: 100%; height: 88vh; border: 0; background: #fff; }
    #probe { padding: 8px 14px; font-family: ui-monospace, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Nested iframe probe &mdash; target is loaded DIRECTLY (no server proxy)</h1>
  <div id="probe">loading...</div>
  <iframe id="f" src="https://www.google.com/search?igu=1&q=youtube"></iframe>
  <script>
    const f = document.getElementById('f');
    const probe = document.getElementById('probe');
    let reported = false;

    function report(line) {
      probe.textContent += '\n' + line;
    }

    f.addEventListener('load', () => {
      report('iframe load fired');
      // Cross-origin: we cannot read contentDocument, but we CAN measure the
      // frame's inner size via postMessage-free heuristics.
      setTimeout(() => {
        try {
          const win = f.contentWindow;
          report('contentWindow reachable: ' + (!!win));
          report('frames inside (win.length): ' + (win ? win.length : 'n/a'));
        } catch (e) {
          report('contentWindow access error: ' + e.message);
        }
      }, 3000);
    });

    f.addEventListener('error', () => report('iframe ERROR event'));

    report('probe loaded, waiting...');
  </script>
</body>
</html>
