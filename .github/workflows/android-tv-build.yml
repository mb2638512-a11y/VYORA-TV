name: Build VYORA Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [feature/android-tv-app]
    paths:
      - "android/**"
      - "web/**"
      - "server/**"
      - "server-go/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-tv-build.yml"
permissions:
  contents: write
  actions: write
jobs:
  tv-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: npm ci
      - run: npm run data
      - run: npm run build:vod
      - name: Validate all VOD catalogue mirrors before packaging
        run: npm run validate:vod
      - name: Commit generated VOD catalog for the app and API
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f server/data/vod/*.json web/public/data/vod/*.json android/app/assets/data/vod/*.json
          if git diff --cached --quiet; then
            echo "Generated VOD catalog is already up to date."
          else
            git commit -m "chore: refresh generated VOD catalog [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: npx tsc --noEmit -p web/tsconfig.json
      - run: npm --workspace web run build
      - name: Bundle latest web platform into Android TV app
        run: |
          rm -rf android/app/assets
          mkdir -p android/app/assets
          cp -a web/dist/. android/app/assets/
      - name: Build TV APK
        run: |
          cd android
          gradle --no-daemon --stacktrace :app:assembleTvDebug
      - name: Remove previous tv APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "vyora-android-tv-debug") | .id' |
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id"
            echo "Deleted previous tv APK artifact $artifact_id"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vyora-android-tv-debug
          path: android/app/build/outputs/apk/tv/debug/*.apk
          if-no-files-found: error
          retention-days: 1
