name: Browser and Go checks

on:
  push:
    branches:
      - main
      - fix/browser-search-engines
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-build:
    name: Web TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --workspace web run build

  go-tests:
    name: Go backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.mod
      - working-directory: server-go
        run: go test ./...
