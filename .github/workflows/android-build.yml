name: Build Vyora Android APKs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "web/**"
      - "server/**"
      - "server-go/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/android-build.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "web/**"
      - "server/**"
      - "server-go/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  android-apks:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK package installation failed" }

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build bundled channel data
        run: npm run data

      - name: Build web app
        run: npm --workspace web run build

      - name: Build Android TV APK
        shell: pwsh
        env:
          GITHUB_ACTIONS: "true"
        run: ./android/build-apk.ps1 -Variant tv

      - name: Build Android phone APK
        shell: pwsh
        env:
          GITHUB_ACTIONS: "true"
        run: ./android/build-apk.ps1 -Variant phone

      - name: Upload phone and TV APKs
        uses: actions/upload-artifact@v4
        with:
          name: vyora-android-apks
          path: android/out/Vyora-*.apk
          if-no-files-found: error
          retention-days: 14
